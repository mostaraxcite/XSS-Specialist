name: Verify XSS Specialist Runtime

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-runtime.yml"
      - "runtime/**"
      - "xss_specialist/**"
      - "live/**"
      - "verification/**"
      - "tests/**"
      - "models/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install runtime dependencies
        run: uv sync --group dev --group slm

      - name: Live-scan regression tests
        run: uv run pytest -q tests/test_live_regressions.py

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Runtime doctor
        run: uv run xss doctor

      - name: Load frozen v4e + Flow v2 and verify structural inference
        shell: bash
        run: |
          set -euxo pipefail
          uv run xss fields --source "location.hash" --sink "element.innerHTML" --statement "element.innerHTML = location.hash" > /tmp/inference.json
          cat /tmp/inference.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/inference.json"))
          assert d["source"]["label"] == "BROWSER", d["source"]
          assert d["sink"]["label"] == "DANGEROUS_HTML", d["sink"]
          assert d["flow"]["label"] == "CONNECTED", d["flow"]
          assert d["confirmed"] is False
          print("semantic v4e + flow v2 inference: PASS")
          PY

      - name: Local browser acceptance gate
        run: |
          uv run xss accept
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("runs/live_acceptance_gate.json")
          assert p.exists(), "missing local acceptance gate"
          d=json.loads(p.read_text())
          assert d.get("ACCEPTED") is True, d
          print("browser acceptance: PASS")
          PY
